<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>트리거 드릴</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="트리거 드릴">
<meta name="theme-color" content="#17203a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
/* Layout: one narrow answer-sheet column (max 640px), thumb-zone actions at the bottom; OMR-sheet motif — salmon guide ink on paper / navy. */
:root{
  --paper:#f6f4ef; --sheet:#ffffff; --ink:#1d2433; --muted:#667085; --rule:#e6dfd6;
  --omr:#d9604a; --omr-soft:#fbe6e1; --good:#1f8a5b; --good-soft:#e2f3ea; --bad:#c2412d; --bad-soft:#fbe4df;
  --bar:#1d2433; --track:#ece7df; --mid:#c98a1b;
  --f-body:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#111a30; --sheet:#17203a; --ink:#ece8df; --muted:#9aa3b8; --rule:#2a3555;
  --omr:#f47e68; --omr-soft:#3a2830; --good:#4cc38a; --good-soft:#163a31; --bad:#f2836f; --bad-soft:#3d2228;
  --bar:#ece8df; --track:#26314f; --mid:#e3b04b; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111a30; --sheet:#17203a; --ink:#ece8df; --muted:#9aa3b8; --rule:#2a3555;
  --omr:#f47e68; --omr-soft:#3a2830; --good:#4cc38a; --good-soft:#163a31; --bad:#f2836f; --bad-soft:#3d2228;
  --bar:#ece8df; --track:#26314f; --mid:#e3b04b; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;
  -webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 24px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--omr);outline-offset:2px}
math{font-size:1.05em}
.label{font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:600}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* Home */
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-top:8px}
.brand h1{margin:0;font-size:26px;font-weight:700;letter-spacing:-.01em}
.brand h1 span{color:var(--omr)}
.lede{margin:0;color:var(--muted);font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border-block:1px solid var(--rule)}
.stat{padding:12px 4px;display:flex;flex-direction:column;gap:2px;align-items:flex-start}
.stat+.stat{border-left:1px dashed var(--rule);padding-left:14px}
.stat b{font-family:var(--f-mono);font-size:24px;font-weight:600;line-height:1.1}
.stat small{font-size:12px;color:var(--muted)}
.stat.alert b{color:var(--omr)}
.group{display:flex;flex-direction:column;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--rule);background:var(--sheet);border-radius:999px;padding:7px 13px;font-size:14px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip .n{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--omr);background:var(--omr-soft);color:var(--ink)}
.chip[aria-pressed="true"] .n{color:var(--omr)}
.seg{display:flex;border:1.5px solid var(--rule);border-radius:10px;overflow:hidden;width:max-content;background:var(--sheet)}
.seg button{border:0;background:none;padding:7px 16px;cursor:pointer;font-family:var(--f-mono);font-size:14px}
.seg button+button{border-left:1.5px solid var(--rule)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.tabs{display:flex;gap:3px;background:var(--track);border-radius:12px;padding:3px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 0 auto;min-width:96px;border:0;background:none;padding:7px 10px;border-radius:9px;font-size:14.5px;font-weight:600;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1.25}
.tabs button small{font-size:11px;font-weight:500;opacity:.8}
.tabs button[aria-selected="true"]{background:var(--sheet);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.quick{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-top:-4px}
.quick::-webkit-scrollbar{display:none}
.q{flex:none;border:1.5px solid var(--rule);background:var(--sheet);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.q i{width:7px;height:7px;border-radius:50%}
.q:active{border-color:var(--omr);background:var(--omr-soft)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (min-width:560px){.tiles{grid-template-columns:repeat(3,1fr)}}
.tile{border:1.5px solid var(--rule);background:var(--sheet);border-radius:14px;padding:10px 11px;display:flex;flex-direction:column;gap:6px;text-align:left;cursor:pointer;min-height:96px;min-width:0}
.tile[aria-pressed="true"]{border-color:var(--omr);background:var(--omr-soft)}
.tile .tn{font-family:var(--f-mono);font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:6px}
.tile .bk{font-family:var(--f-body);margin-left:5px;font-size:10.5px;border:1px solid var(--rule);border-radius:5px;padding:0 4px}
.tile b{font-size:14px;font-weight:600;line-height:1.3;flex:1}
.tile .tc{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.mbar{display:block;height:5px;background:var(--track);border-radius:3px;overflow:hidden}
.mbar>span{display:block;height:100%;border-radius:3px}
.selnote{margin:0;font-size:13px;color:var(--muted)}
.actions{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding-top:8px}
.btn{border:0;border-radius:14px;padding:16px;font-size:17px;font-weight:700;cursor:pointer;background:var(--ink);color:var(--paper);width:100%}
.btn.alt{background:var(--sheet);color:var(--ink);border:1.5px solid var(--rule);font-weight:600}
.btn.alt b{color:var(--omr);font-family:var(--f-mono)}
.btn:disabled{opacity:.4;cursor:default}
.linkrow{display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
.linkrow button{background:none;border:0;color:var(--muted);font-size:13px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;padding:4px}

/* Drill */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.quit{background:none;border:0;color:var(--muted);font-size:14px;cursor:pointer;padding:6px 0}
.combo{font-family:var(--f-mono);font-size:14px;color:var(--muted)}
.combo b{color:var(--omr);font-size:16px}
.timer{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.track{height:8px;background:var(--track);border-radius:4px;overflow:hidden}
.fill{height:100%;background:var(--bar);transform-origin:left;width:100%}
.fill.low{background:var(--omr)}
.secs{font-family:var(--f-mono);font-weight:600;font-size:15px;min-width:3.4ch;text-align:right}
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px}
.meta{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
.meta .unit{color:var(--omr);font-weight:600;letter-spacing:.02em}
.trigger{font-size:18px;font-weight:500;line-height:1.65;margin:0;overflow-x:auto;overflow-y:hidden}
.opts{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.opt{width:100%;display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;text-align:left;
  background:var(--sheet);border:1.5px solid var(--rule);border-radius:12px;padding:12px 14px;cursor:pointer;font-size:15px;line-height:1.55}
.opt:active:not(:disabled){transform:scale(.99)}
.opt:disabled{cursor:default}
.bub{width:24px;height:30px;border:1.8px solid var(--omr);border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;color:var(--omr);margin-top:-2px}
.opt .t{min-width:0;overflow-x:auto;overflow-y:hidden}
.opt .why{grid-column:2;font-size:13.5px;color:var(--muted);border-top:1px dashed var(--rule);padding-top:8px;margin-top:2px}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .bub{background:var(--good);border-color:var(--good);color:var(--sheet)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .bub{background:var(--bad);border-color:var(--bad);color:var(--sheet)}
.opt.dim{opacity:.72}
.verdict{display:flex;flex-direction:column;gap:6px;border-left:4px solid var(--good);padding:4px 0 4px 12px}
.verdict.bad{border-color:var(--bad)}
.verdict h3{margin:0;font-size:16px;display:flex;justify-content:space-between;gap:8px}
.verdict h3 .mono{font-size:13px;color:var(--muted);font-weight:500}
.verdict p{margin:0;font-size:14.5px;overflow-x:auto;overflow-y:hidden}
.verdict .algo{font-size:12px;color:var(--muted);letter-spacing:.02em}
.units{display:flex;flex-direction:column;gap:14px}
.row2{display:flex;flex-wrap:wrap;gap:16px 28px}
math mtable{font-size:.95em}
.timer .fill{width:0;transform:none}
.timer .fill.over{background:var(--omr)}
.drill-actions .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt.none{grid-template-columns:1fr;border-style:dashed;color:var(--muted);font-size:14.5px}
.row .mark.m{color:var(--mid)}
.conf{display:flex;flex-direction:column;gap:8px}
.conf div{font-size:13.5px;line-height:1.5;border-left:3px solid var(--mid);padding-left:10px;overflow-x:auto}
.conf small{color:var(--muted)}
.drill-actions{position:sticky;bottom:0;padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--paper) 70%,transparent)}

/* Result */
.score{display:flex;align-items:baseline;gap:10px;padding-top:12px}
.score b{font-family:var(--f-mono);font-size:56px;font-weight:600;line-height:1}
.score span{font-family:var(--f-mono);color:var(--muted);font-size:20px}
.rows{display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.row{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--rule);font-size:14px}
.row .mark{font-family:var(--f-mono);font-weight:600}
.row .mark.o{color:var(--good)} .row .mark.x{color:var(--bad)}
.row .rq{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-family:var(--f-mono);color:var(--muted);font-size:12.5px}

/* Panel */
.panel{position:fixed;inset:0;background:rgba(10,14,25,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.panel>div{background:var(--sheet);width:100%;max-width:640px;border-radius:18px 18px 0 0;display:flex;flex-direction:column;gap:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px calc(18px + env(safe-area-inset-bottom,0px))}
.panel h2{margin:0;font-size:18px}
.panel p{margin:0;font-size:14px;color:var(--muted)}
.panel textarea{width:100%;min-height:140px;border:1.5px solid var(--rule);border-radius:10px;padding:10px;font-family:var(--f-mono);font-size:12px;background:var(--paper);color:var(--ink);resize:vertical}
.panel .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{font-size:13px;color:var(--good);min-height:1.2em}
@media (min-width:700px){.trigger{font-size:20px}.opt{font-size:16px}}
@media (prefers-reduced-motion:reduce){.opt:active:not(:disabled){transform:none}}
</style>

<body>


<div class="wrap" id="app"></div>

<script>
(() => {
"use strict";
const STORE = "trigger-drill-v1";
let CARDS = [];
let S = load();
let run = null;                // current drill
const app = document.getElementById("app");

/* ---------- storage ---------- */
function load(){
  const def = () => ({units:[], size:10, pace:1});
  try{ const s = JSON.parse(localStorage.getItem(STORE)); if(s && s.cards){ s.settings = Object.assign(def(), s.settings || {}); return s; } }catch(e){}
  return {cards:{}, settings:def()};
}
function save(){ try{ localStorage.setItem(STORE, JSON.stringify(S)); }catch(e){} }
/* ---------- sync (GitHub Gist) ---------- */
// 기기마다 토큰을 한 번 입력하면 비공개 Gist 하나에 카드 기록을 올리고 받아 합친다. 설정(단원 선택 등)은 기기별로 둔다.
const SYNC_KEY = "trigger-drill-sync", GH = "https://api.github.com", GFILE = "trigger-drill.json";
let SY = (() => { try{ return JSON.parse(localStorage.getItem(SYNC_KEY)) || {}; }catch(e){ return {}; } })();
let syncing = false;
function saveSync(){ try{ localStorage.setItem(SYNC_KEY, JSON.stringify(SY)); }catch(e){} }
// 카드별로 마지막에 푼 기록을 살리고, 푼 횟수·틀린 횟수는 큰 쪽. 초기화 시각 이전 기록은 버림.
function mergeState(a, b){
  const r = Math.max(a.resetAt || 0, b.resetAt || 0), out = {};
  for(const src of [a.cards || {}, b.cards || {}]) for(const id in src){
    const v = src[id]; if(!v || (v.last || 0) < r) continue;
    const cur = out[id];
    if(!cur){ out[id] = Object.assign({}, v); continue; }
    const newer = (v.last || 0) > (cur.last || 0) ? v : cur;
    out[id] = Object.assign({}, newer, {seen: Math.max(v.seen || 0, cur.seen || 0), miss: Math.max(v.miss || 0, cur.miss || 0)});
  }
  const conf = {};
  for(const src of [a.conf || {}, b.conf || {}]) for(const k in src){
    const v = src[k]; if(!v || (v.at || 0) < r) continue;
    const cur = conf[k];
    conf[k] = cur ? {n: Math.max(cur.n, v.n), t: Math.max(cur.t, v.t), at: Math.max(cur.at || 0, v.at || 0)} : Object.assign({}, v);
  }
  return {cards: out, resetAt: r, setNo: Math.max(a.setNo || 0, b.setNo || 0), conf};
}
function applyMerge(m){ S.cards = m.cards; S.resetAt = m.resetAt; S.setNo = m.setNo; S.conf = m.conf; save(); }
const shareable = () => ({cards: S.cards, resetAt: S.resetAt || 0, setNo: S.setNo || 0, conf: S.conf || {}});
async function gh(path, opt){
  opt = opt || {};
  const h = {Accept: "application/vnd.github+json", Authorization: "Bearer " + SY.token};
  if(opt.body) h["Content-Type"] = "application/json";
  const r = await fetch(GH + path, Object.assign({}, opt, {headers: h, cache: "no-store"}));
  if(!r.ok){ const e = new Error("gh " + r.status); e.status = r.status; throw e; }
  return r.json();
}
async function findGist(){
  if(SY.gist) return SY.gist;
  for(let page = 1; page <= 5; page++){
    const L = await gh(`/gists?per_page=100&page=${page}`);
    const g = L.find(x => x.files && x.files[GFILE]);
    if(g){ SY.gist = g.id; saveSync(); return g.id; }
    if(L.length < 100) break;
  }
  return null;
}
async function sync(){
  if(!SY.token || syncing || !navigator.onLine) { updateSyncUI(); return; }
  syncing = true; updateSyncUI();
  try{
    const id = await findGist();
    let remote = {cards: {}};
    if(id){
      const g = await gh("/gists/" + id), f = g.files && g.files[GFILE];
      if(f){ let txt = f.content; if(f.truncated) txt = await (await fetch(f.raw_url, {cache: "no-store"})).text(); try{ remote = JSON.parse(txt) || remote; }catch(e){} }
    }
    applyMerge(mergeState(S, remote));
    const content = JSON.stringify(Object.assign(shareable(), {updated: Date.now()}));
    if(id) await gh("/gists/" + id, {method: "PATCH", body: JSON.stringify({files: {[GFILE]: {content}}})});
    else { const g = await gh("/gists", {method: "POST", body: JSON.stringify({description: "트리거 드릴 학습 기록 (앱이 자동 관리)", public: false, files: {[GFILE]: {content}}})}); SY.gist = g.id; }
    SY.at = Date.now(); SY.err = "";
  }catch(e){
    SY.err = e.status === 401 ? "토큰이 맞지 않거나 만료됐어요." : e.status === 403 ? "토큰에 gist 권한이 없어요." : e.status === 404 ? "기록 Gist를 찾지 못했어요. 다시 동기화하면 새로 만듭니다." : "인터넷 연결을 확인하세요.";
    if(e.status === 404) SY.gist = "";
  }finally{
    syncing = false; saveSync(); updateSyncUI();
    if(!run && CARDS.length && !document.querySelector(".panel")) home();
  }
}
function syncLabel(){
  if(!SY.token) return "동기화 꺼짐";
  if(syncing) return "동기화 중…";
  if(SY.err) return "동기화 실패";
  if(SY.at){ const d = new Date(SY.at); return `동기화 ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; }
  return "동기화 대기";
}
function updateSyncUI(){
  const b = document.getElementById("sync"); if(b) b.textContent = syncLabel();
  const m = document.getElementById("sy-msg"); if(m){ m.style.color = SY.err ? "var(--bad)" : ""; m.textContent = SY.err || (SY.at ? syncLabel() + " 완료" : ""); }
}

const st = id => S.cards[id] || (S.cards[id] = {box:0, miss:0, seen:0});
const isPending = c => { const s = S.cards[c.id]; return !!(s && s.box === 0 && s.miss > 0); };

/* ---------- helpers ---------- */
const esc = s => s.replace(/[&<>"]/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));
function tex(str){
  // render $...$ with KaTeX as native MathML (no CSS/fonts needed, works offline)
  const parts = str.split(/(\$[^$]+\$)/g);
  return parts.map(p => {
    if(p.length > 2 && p[0] === "$" && p[p.length-1] === "$"){
      const src = p.slice(1, -1);
      if(window.katex){ try{ return katex.renderToString(src, {output:"mathml", throwOnError:false}); }catch(e){} }
      return "<code>" + esc(src) + "</code>";
    }
    return esc(p);
  }).join("");
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.random()*(i+1)|0; [a[i],a[j]]=[a[j],a[i]]; } return a; }
const units = () => [...new Set(CARDS.map(c => c.unit))];
const subjects = () => [...new Set(CARDS.map(c => c.subject))];
let unitSubj = {};
function unitAcc(u){
  let seen = 0, miss = 0;
  for(const c of CARDS) if(c.unit === u){ const s = S.cards[c.id]; if(s){ seen += s.seen; miss += s.miss; } }
  return seen ? Math.max(0, seen - miss) / seen : null;
}
const accColor = p => p == null ? "var(--track)" : p < .5 ? "var(--bad)" : p < .8 ? "var(--mid)" : "var(--good)";
function activeCards(){
  const u = S.settings.units;
  return CARDS.filter(c => !u.length || u.includes(c.unit));
}
// 출제: "세트 수"로 간격을 둔다. 빠르게 떠올려 맞히면 단계가 올라가고, 단계가 높을수록 여러 세트 쉰다.
const GAP = [0, 1, 2, 4, 8, 16];
const ansText = c => c.options[c.answer].text;
const isDue = c => { const s = S.cards[c.id]; return !s || !s.seen || (s.due || 0) <= (S.setNo || 0); };
const isMastered = c => { const s = S.cards[c.id]; return !!(s && (s.streak || 0) >= 3); };
const flagged = () => CARDS.filter(c => S.cards[c.id] && S.cards[c.id].flag);
// 최근 20세트 안에 헷갈린 풀이법 (정답·고른 것 양쪽)
function confusedTexts(){
  const out = new Set(), N = S.setNo || 0;
  for(const k in (S.conf || {})){ const v = S.conf[k]; if(N - (v.t || 0) <= 20){ const [a, b] = k.split("\u0001"); out.add(a); out.add(b); } }
  return out;
}
function weight(c, conf){
  const s = S.cards[c.id];
  let w = !s || !s.seen ? 2 : (s.box === 0 && s.miss > 0) ? 6 : 1 / (1 + s.box);
  if(conf.has(ansText(c))) w += 3;
  return w;
}
function pick(pool, n){
  const conf = confusedTexts();
  const due = pool.filter(isDue), rest = pool.filter(c => !isDue(c)).sort((a, b) => (S.cards[a.id].due || 0) - (S.cards[b.id].due || 0));
  const items = due.map(c => ({c, w: weight(c, conf)})), out = [];
  while(out.length < n && items.length){
    const tot = items.reduce((a,b) => a + b.w, 0);
    let r = Math.random() * tot, i = 0;
    for(; i < items.length - 1; i++){ r -= items[i].w; if(r <= 0) break; }
    out.push(items.splice(i,1)[0].c);
  }
  while(out.length < n && rest.length) out.push(rest.shift());
  return shuffle(out);
}
// 빠름 기준: 문제 글자 수에 비례 (읽는 시간 포함), 설정으로 배율 조절
const PACES = [["빠듯", 0.75], ["보통", 1], ["여유", 1.4]];
function thr(c){
  const n = c.trigger.replace(/\\[a-zA-Z]+|[{}$^_\\]/g, "").replace(/\s+/g, "").length;
  return Math.round(Math.min(30, Math.max(8, 5 + n / 7)) * (S.settings.pace || 1));
}

/* ---------- drill ---------- */
// 1단계: 문제만 보고 풀이법을 떠올린다 (시간은 재지만 끊지 않음)
// 2단계: "떠올렸어요"를 누르면 선지가 열리고 떠올린 것과 같은 걸 고른다
let raf = 0, t0 = 0;
function stopTimer(){ cancelAnimationFrame(raf); raf = 0; }
function start(list, counted){
  if(!list.length) return;
  if(!counted) S.setNo = (S.setNo || 0) + 1;
  save();
  run = {list: list.map(c => ({c, retry: false})), i: 0, combo: 0, best: 0, log: []};
  question();
}
const item = () => run.list[run.i];
function question(){
  const {c, retry} = item(), T = thr(c);
  run.stage = "recall"; run.done = false; run.ms = null;
  run.order = shuffle(c.options.map((_,k) => k));
  app.innerHTML = `
    <div class="top">
      <button class="quit" id="quit">← 그만하기</button>
      <span class="combo mono">${run.i+1} / ${run.list.length}${run.combo >= 2 ? ` · 콤보 <b>${run.combo}</b>` : ""}</span>
    </div>
    <div class="timer" aria-hidden="true"><div class="track"><div class="fill" id="fill"></div></div><span class="secs" id="secs">0.0</span></div>
    <article class="sheet">
      <div class="meta"><span class="unit">${esc(c.unit)}${retry ? " · 다시" : ""}</span><span>${esc(c.source || "")} · 기준 ${T}초</span></div>
      <p class="trigger">${tex(c.trigger)}</p>
      <ol class="opts" id="opts" hidden></ol>
      <div id="fb"></div>
    </article>
    <div class="drill-actions" id="acts">
      <div class="two"><button class="btn alt" id="idk">모르겠어요</button><button class="btn" id="recall">떠올렸어요</button></div>
    </div>`;
  app.querySelector("#quit").onclick = () => run.log.length ? result() : home();
  app.querySelector("#recall").onclick = recall;
  app.querySelector("#idk").onclick = () => { stopRecall(); finish("idk"); };
  window.scrollTo(0,0);
  t0 = performance.now();
  const fill = app.querySelector("#fill"), secs = app.querySelector("#secs");
  const tick = now => {
    const e = (now - t0) / 1000;
    fill.style.width = Math.min(100, e / T * 100) + "%";
    fill.classList.toggle("over", e > T);
    secs.textContent = e.toFixed(1);
    raf = requestAnimationFrame(tick);
  };
  raf = requestAnimationFrame(tick);
}
function stopRecall(){ if(run.ms === null){ run.ms = performance.now() - t0; stopTimer(); } }
function recall(){
  if(run.stage !== "recall") return;
  stopRecall(); run.stage = "choose";
  const {c} = item(), ol = app.querySelector("#opts");
  ol.innerHTML = run.order.map((k,pos) => `<li><button class="opt" data-k="${k}" id="opt-${pos}"><span class="bub">${pos+1}</span><span class="t">${tex(c.options[k].text)}</span></button></li>`).join("")
    + `<li><button class="opt none" id="opt-none">떠올린 풀이법이 선지에 없어요</button></li>`;
  ol.hidden = false;
  app.querySelector("#acts").innerHTML = "";
  ol.onclick = e => {
    if(run.stage !== "choose") return;
    if(e.target.closest("#opt-none")){ noneAsk(); return; }
    const b = e.target.closest(".opt[data-k]"); if(b) choose(+b.dataset.k);
  };
}
function reveal(chosen){
  const {c} = item(), ol = app.querySelector("#opts");
  if(ol.hidden){ ol.innerHTML = run.order.map((k,pos) => `<li><button class="opt" data-k="${k}" id="opt-${pos}"><span class="bub">${pos+1}</span><span class="t">${tex(c.options[k].text)}</span></button></li>`).join(""); ol.hidden = false; }
  const none = ol.querySelector("#opt-none"); if(none) none.parentElement.remove();
  ol.querySelectorAll(".opt[data-k]").forEach(b => {
    const k = +b.dataset.k; b.disabled = true;
    b.classList.add(k === c.answer ? "right" : k === chosen ? "wrong" : "dim");
    b.insertAdjacentHTML("beforeend", `<span class="why">${tex(c.options[k].why)}</span>`);
  });
}
function noneAsk(){
  run.stage = "none"; reveal(null);
  app.querySelector("#acts").innerHTML = `<p class="hint" style="margin:0 0 8px;font-size:13.5px;color:var(--muted)">정답과 해설을 보고 골라 주세요.</p>
    <div class="two"><button class="btn alt" id="mine">내 방법도 맞아요</button><button class="btn" id="mywrong">내가 틀렸어요</button></div>`;
  app.querySelector("#mine").onclick = () => finish("mine");
  app.querySelector("#mywrong").onclick = () => finish("nonewrong");
}
function choose(k){
  const {c} = item();
  if(k === c.answer) finish(run.ms / 1000 <= thr(c) ? "fast" : "slow", k);
  else finish("wrong", k);
}
const GOOD = new Set(["fast", "slow", "mine"]);
const LABEL = {fast: "빠르게 떠올림", slow: "맞음 · 느림", mine: "내 방법도 맞음", wrong: "오답", idk: "모름", nonewrong: "떠올린 방법이 틀림"};
function grade(c, res){
  const s = st(c.id), N = S.setNo || 0; s.seen++; s.last = Date.now();
  if(res === "fast"){ s.box = Math.min(s.box + 1, 5); s.streak = (s.streak || 0) + 1; s.due = N + GAP[s.box]; }
  else if(res === "slow"){ s.streak = 0; s.due = N + 1; }
  else if(res === "mine"){ s.flag = (s.flag || 0) + 1; s.due = N + 1; }
  else { s.box = 0; s.streak = 0; s.miss++; s.due = N + 1; }
}
function finish(res, k){
  if(run.done) return;
  run.done = true; run.stage = "done";
  const {c, retry} = item(), T = thr(c), ms = run.ms;
  if(!retry) grade(c, res);
  if(res === "wrong" && k != null){
    S.conf = S.conf || {};
    const key = ansText(c) + "\u0001" + c.options[k].text, v = S.conf[key] || {n: 0};
    S.conf[key] = {n: v.n + 1, t: S.setNo || 0, at: Date.now()};
  }
  save();
  const good = GOOD.has(res);
  if(good){ run.combo++; run.best = Math.max(run.best, run.combo); }
  else { run.combo = 0; if(navigator.vibrate) try{ navigator.vibrate(60); }catch(e){} }
  // 막힌 카드는 같은 세트 3문제 뒤에 한 번 더
  if(!good && !retry){ const at = Math.min(run.i + 4, run.list.length); run.list.splice(at, 0, {c, retry: true}); }
  run.log.push({c, res, ms, retry, k});
  if(res !== "idk" && res !== "mine" && res !== "nonewrong") reveal(k);
  else if(res === "idk") reveal(null);
  const msTxt = res === "idk" ? `${(ms/1000).toFixed(1)}초 · 모름` : `${(ms/1000).toFixed(1)}초 / 기준 ${T}초`;
  app.querySelector("#fb").innerHTML = `
    <div class="verdict ${good ? "" : "bad"}">
      <h3>${LABEL[res]}${retry ? " (다시)" : ""}<span class="mono">${msTxt}</span></h3>
      <p>${tex(c.key)}</p>
      ${c.algo ? `<span class="algo">${esc(c.algo)} · ${c.algoSrc === "노트" ? "알고리즘 노트" : c.algoSrc === "약점노트" ? "약점 노트" : c.algoSrc === "직접 제안" ? "직접 제안" : "교재 보충"}</span>` : ""}
      ${!good && !retry ? `<span class="algo">3문제 뒤에 한 번 더 나와요.</span>` : ""}
    </div>`;
  app.querySelector("#acts").innerHTML = `<button class="btn" id="next">${run.i+1 < run.list.length ? "다음 문제" : "결과 보기"}</button>`;
  app.querySelector("#next").onclick = next;
  const fb = app.querySelector("#fb");
  setTimeout(() => fb.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "nearest"}), 50);
}
function next(){
  run.i++;
  if(run.i < run.list.length) question(); else result();
}

/* ---------- result ---------- */
// 결과표에는 문제 원문 대신 "단원 주제 · 출처"만 한 줄로
function resTag(c){
  const topic = (c.unit || "").replace(/^[\d~]+강\s*/, "");
  return esc(topic ? `${topic} · ${c.source}` : c.source);
}
const MARK = {fast: ["O", "o"], slow: ["△", "m"], mine: ["O", "m"], wrong: ["X", "x"], idk: ["?", "x"], nonewrong: ["X", "x"]};
function result(){
  stopTimer();
  const L = run.log, first = L.filter(x => !x.retry);
  const cnt = r => first.filter(x => r.includes(x.res)).length;
  const fast = cnt(["fast"]), slow = cnt(["slow", "mine"]), stuck = first.length - fast - slow;
  const times = first.filter(x => GOOD.has(x.res)).map(x => x.ms);
  const avg = times.length ? (times.reduce((a,b)=>a+b,0)/times.length/1000).toFixed(1) : "–";
  const missed = [...new Set(first.filter(x => !GOOD.has(x.res)).map(x => x.c))];
  const pairs = first.filter(x => x.res === "wrong").map(x => [x.c, x.c.options[x.k].text]);
  app.innerHTML = `
    <div class="top"><span class="label">세트 결과</span><span class="combo mono">최고 콤보 <b>${run.best}</b></span></div>
    <div class="score"><b>${fast}</b><span>/ ${first.length} 빠르게 떠올림</span></div>
    <p class="lede">느림 ${slow} · 막힘 ${stuck} · 떠올린 시간 평균 <span class="mono">${avg}초</span>${missed.length ? ` · 막힌 ${missed.length}개는 재출제 대기로 들어갔어요.` : ""}</p>
    <div class="rows">
      ${L.map(x => `<div class="row"><span class="mark ${MARK[x.res][1]}">${MARK[x.res][0]}</span><span class="rq">${x.retry ? "↻ " : ""}${resTag(x.c)}</span><span class="s">${x.res === "idk" ? "모름" : (x.ms/1000).toFixed(1)+"s"}</span></div>`).join("")}
    </div>
    ${pairs.length ? `<section class="conf"><span class="label">헷갈린 풀이법 · 다음 세트에 섞어서 나와요</span>${pairs.map(([c, b]) => `<div><small>정답</small> ${tex(ansText(c))}<br><small>고른 것</small> ${tex(b)}</div>`).join("")}</section>` : ""}
    <div class="actions">
      ${missed.length ? `<button class="btn" id="again">막힌 ${missed.length}개 바로 다시</button>` : ""}
      <button class="btn ${missed.length ? "alt" : ""}" id="home">처음으로</button>
    </div>`;
  const again = app.querySelector("#again");
  if(again) again.onclick = () => start(shuffle(missed.slice()));
  app.querySelector("#home").onclick = home;
  window.scrollTo(0,0);
  sync();
}

/* ---------- panels ---------- */
function panel(html){
  const p = document.createElement("div"); p.className = "panel";
  p.innerHTML = `<div role="dialog" aria-modal="true">${html}</div>`;
  p.onclick = e => { if(e.target === p) p.remove(); };
  document.body.appendChild(p); return p;
}
function backupPanel(){
  const p = panel(`
    <h2>기록 내보내기·가져오기</h2>
    <p>아래 글자를 복사해 다른 기기의 같은 칸에 붙여 넣고 가져오기를 누르면 두 기기의 기록이 합쳐집니다. 자동 동기화를 켜 두었다면 쓸 일이 거의 없어요.</p>
    <textarea id="bk" spellcheck="false">${esc(JSON.stringify(shareable()))}</textarea>
    ${flagged().length ? `<p>"내 방법도 맞아요"로 표시한 카드: ${flagged().map(c => esc(c.book + " " + c.source)).join(", ")} · Claude에게 알려 주면 선지를 보완해요.</p>` : ""}
    <div class="toast" id="bk-msg"></div>
    <div class="two"><button class="btn alt" id="bk-copy">복사</button><button class="btn" id="bk-load">붙여 넣은 기록 합치기</button></div>
    <button class="btn alt" id="bk-close">닫기</button>`);
  const ta = p.querySelector("#bk"), msg = p.querySelector("#bk-msg");
  p.querySelector("#bk-copy").onclick = () => {
    const done = () => { msg.style.color = ""; msg.textContent = "복사했어요."; };
    if(navigator.clipboard) navigator.clipboard.writeText(ta.value).then(done, () => { ta.select(); msg.textContent = "선택해 두었어요. 직접 복사하세요."; });
    else { ta.select(); msg.textContent = "선택해 두었어요. 직접 복사하세요."; }
  };
  p.querySelector("#bk-load").onclick = () => {
    try{ const s = JSON.parse(ta.value); if(!s || typeof s.cards !== "object") throw 0;
      applyMerge(mergeState(S, s)); p.remove(); home(); sync(); }
    catch(e){ msg.style.color = "var(--bad)"; msg.textContent = "기록 형식이 아니에요. 백업한 글자 전체를 붙여 넣었는지 확인하세요."; }
  };
  p.querySelector("#bk-close").onclick = () => p.remove();
}
function syncPanel(){
  const on = !!SY.token;
  const p = panel(`
    <h2>기기 간 자동 동기화</h2>
    ${on ? `<p>이 기기는 GitHub 비공개 Gist로 동기화 중이에요. 앱을 열 때와 세트를 끝낼 때 자동으로 기록을 합칩니다.</p>`
         : `<p>GitHub 토큰을 한 번 넣어 두면 폰·PC·아이패드 기록이 자동으로 합쳐집니다. 기기마다 같은 토큰을 넣으면 돼요.</p>
            <p>만드는 법: GitHub → Settings → Developer settings → Personal access tokens → Tokens (classic) → Generate new token → 권한은 <b>gist</b>만 체크.</p>
            <input id="sy-tok" type="password" autocomplete="off" spellcheck="false" placeholder="ghp_로 시작하는 토큰" style="width:100%;border:1.5px solid var(--rule);border-radius:10px;padding:12px;font-family:var(--f-mono);font-size:14px;background:var(--paper);color:var(--ink)">`}
    <div class="toast" id="sy-msg"></div>
    ${on ? `<div class="two"><button class="btn alt" id="sy-off">이 기기 연결 해제</button><button class="btn" id="sy-now">지금 동기화</button></div>`
         : `<button class="btn" id="sy-on">연결하고 동기화</button>`}
    <button class="btn alt" id="sy-close">닫기</button>`);
  updateSyncUI();
  const close = () => { p.remove(); if(!run) home(); };
  p.querySelector("#sy-close").onclick = close;
  if(on){
    p.querySelector("#sy-now").onclick = () => sync();
    p.querySelector("#sy-off").onclick = () => { SY = {}; saveSync(); close(); };
  } else {
    p.querySelector("#sy-on").onclick = async () => {
      const t = p.querySelector("#sy-tok").value.trim(), msg = p.querySelector("#sy-msg");
      if(!t){ msg.style.color = "var(--bad)"; msg.textContent = "토큰을 붙여 넣으세요."; return; }
      SY = {token: t}; saveSync(); await sync();
      if(SY.err){ const e = SY.err; SY = {}; saveSync(); msg.style.color = "var(--bad)"; msg.textContent = e; }
      else close();
    };
  }
}
function resetPanel(){
  const p = panel(`
    <h2>기록을 모두 지울까요?</h2>
    <p>풀어 본 카드, 정답 횟수, 재출제 대기 목록이 삭제됩니다. 자동 동기화를 켜 두었다면 다른 기기의 기록도 함께 지워집니다. 카드 자체는 그대로 남습니다.</p>
    <div class="two"><button class="btn alt" id="rs-no">취소</button><button class="btn" id="rs-yes" style="background:var(--bad)">지우기</button></div>`);
  p.querySelector("#rs-no").onclick = () => p.remove();
  p.querySelector("#rs-yes").onclick = () => { S = {cards:{}, settings:S.settings, resetAt:Date.now(), setNo:S.setNo || 0, conf:{}}; save(); p.remove(); home(); sync(); };
}

/* ---------- keyboard (Mac/iPad keyboard) ---------- */
document.addEventListener("keydown", e => {
  if(!run || document.querySelector(".panel")) return;
  if(run.stage === "recall"){
    if(e.key === "Enter" || e.key === " "){ e.preventDefault(); recall(); }
    else if(e.key === "?" || e.key === "0"){ stopRecall(); finish("idk"); }
  } else if(run.stage === "choose"){
    if(/^[1-4]$/.test(e.key)){ const b = app.querySelector("#opt-" + (+e.key - 1)); if(b) choose(+b.dataset.k); }
    else if(e.key === "5"){ noneAsk(); }
  } else if(run.done && (e.key === "Enter" || e.key === " ")){ e.preventDefault(); next(); }
});

/* ---------- boot ---------- */
fetch("cards.json", {cache:"no-cache"}).then(r => { if(!r.ok) throw 0; return r.json(); })
  .then(c => { CARDS = c; CARDS.forEach(x => unitSubj[x.unit] = x.subject); const U = new Set(units()); S.settings.units = S.settings.units.filter(u => U.has(u)); home(); sync(); })
  .catch(() => { app.innerHTML = `<p class="lede">카드 파일(cards.json)을 불러오지 못했어요. 인터넷에 한 번 연결한 뒤 다시 열어 주세요.</p>`; });
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible" && !run) sync(); });
if("serviceWorker" in navigator && location.protocol === "https:"){
  try{ navigator.serviceWorker.register("sw.js").catch(() => {}); }catch(e){}
}
})();
</script>
